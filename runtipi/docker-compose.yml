{
  "services": {
    "wizard-calendar": {
      "image": "python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4",
      "user": "0:0",
      "working_dir": "/app",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "environment": {
        "BIND": "0.0.0.0",
        "PORT": "8799",
        "DATA_DIR": "/data",
        "PYTHONDONTWRITEBYTECODE": "1",
        "CALENDAR_TIMEZONE": "${CALENDAR_TIMEZONE:-UTC}",
        "ICAL_SYNC_INTERVAL": "${ICAL_SYNC_INTERVAL:-900}",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}",
        "WIZARD_LOCAL_HOSTS": "127.0.0.1:${APP_PORT},localhost:${APP_PORT},wizard-calendar:8799",
        "WIZARD_SHELL_AUTH": "${WIZARD_SHELL_AUTH:-tailscale-serve}",
        "WIZARD_OWNER_LOGINS": "${WIZARD_OWNER_LOGINS:-}",
        "WIZARD_GRANTS_FILE": "/wizard/grants.json",
        "CALENDAR_RADICALE_URL": "http://wizard-calendar-dav:5232"
      },
      "volumes": [
        "${APP_SOURCE_DIR}:/app:ro",
        "${APP_DATA_DIR}/data:/data"
      ],
      "command": [
        "python",
        "app/server.py"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    },
    "wizard-calendar-dav": {
      "image": "ghcr.io/kozea/radicale:3.9.2@sha256:c74545ef669a3166646ec13438a31b5d0bfff198d8ba7ecd214c0a5f40f03fb4",
      "user": "0:0",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "128m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "volumes": [
        "${APP_DATA_DIR}/data/radicale:/var/lib/radicale"
      ],
      "command": [
        "--hosts",
        "0.0.0.0:5232",
        "--auth-type",
        "htpasswd",
        "--auth-htpasswd-filename",
        "/var/lib/radicale/users",
        "--auth-htpasswd-encryption",
        "plain",
        "--rights-type",
        "owner_only",
        "--storage-filesystem-folder",
        "/var/lib/radicale/collections"
      ]
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
