{
  "services": {
    "calendar-data-init": {
      "image": "wizard-calendar:0.3.0",
      "pull_policy": "never",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=16m"
      ],
      "read_only": true,
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "user": "0:0",
      "cap_add": [
        "CHOWN"
      ],
      "network_mode": "none",
      "command": [
        "python",
        "app/prepare_data.py"
      ],
      "restart": "no",
      "healthcheck": {
        "disable": true
      }
    },
    "wizard-calendar": {
      "image": "wizard-calendar:0.3.0",
      "pull_policy": "never",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp:rw,noexec,nosuid,size=16m"
      ],
      "read_only": true,
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "user": "1000:1000",
      "depends_on": {
        "calendar-data-init": {
          "condition": "service_completed_successfully"
        }
      },
      "environment": {
        "BIND": "0.0.0.0",
        "PORT": "8799",
        "DATA_DIR": "/data",
        "CALENDAR_TIMEZONE": "${CALENDAR_TIMEZONE:-}",
        "CALENDAR_SYNC_MINUTES": "${CALENDAR_SYNC_MINUTES:-10}",
        "CONNECTORS_URL": "${CONNECTORS_URL:-}",
        "WIZARD_GRANTS_FILE": "/wizard/grants.json",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}",
        "WIZARD_LOCAL_HOSTS": "127.0.0.1:${APP_PORT},localhost:${APP_PORT},wizard-calendar:8799"
      },
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
