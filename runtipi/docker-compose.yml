{
  "services": {
    "wizard-calendar": {
      "image": "python:3.12-alpine@sha256:1b668429b3511ab407d8e00648891631b0b1a4d7e15e3ca70f38ab5b91ad4ab4",
      "user": "0:0",
      "working_dir": "/app",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "environment": {
        "BIND": "0.0.0.0",
        "PORT": "8799",
        "DATA_DIR": "/data",
        "PYTHONDONTWRITEBYTECODE": "1",
        "CALENDAR_TIMEZONE": "${CALENDAR_TIMEZONE:-UTC}",
        "ICAL_SYNC_INTERVAL": "${ICAL_SYNC_INTERVAL:-900}",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}",
        "WIZARD_LOCAL_HOSTS": "127.0.0.1:${APP_PORT},localhost:${APP_PORT},wizard-calendar:8799"
      },
      "volumes": [
        "${APP_SOURCE_DIR}:/app:ro",
        "${APP_DATA_DIR}/data:/data"
      ],
      "command": [
        "python",
        "app/server.py"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
