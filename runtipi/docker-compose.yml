{
  "services": {
    "wizard-calendar": {
      "image": "python:3.12-alpine",
      "user": "1000:1000",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "mem_limit": "256m",
      "tmpfs": [
        "/tmp"
      ],
      "read_only": true,
      "environment": {
        "BIND": "0.0.0.0",
        "PORT": "8799",
        "DATA_DIR": "/data",
        "PYTHONDONTWRITEBYTECODE": "1",
        "CALENDAR_TIMEZONE": "${CALENDAR_TIMEZONE:-UTC}",
        "WIZARD_TRUSTED_HOSTS": "${WIZARD_TRUSTED_HOSTS:-}",
        "WIZARD_TRUSTED_ORIGINS": "${WIZARD_TRUSTED_ORIGINS:-}"
      },
      "volumes": [
        "${APP_DATA_DIR}/data:/data"
      ],
      "command": [
        "python",
        "-c",
        "import base64,json,pathlib,runpy\nroot=pathlib.Path('/tmp/wizard-app');root.mkdir(exist_ok=True)\nfiles=json.loads(base64.b64decode(''))\nfor name,text in files.items():\n p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_text(text)\nrunpy.run_path(str(root/'app/server.py'),run_name='__main__')\n"
      ],
      "x-runtipi": {
        "is_main": true,
        "internal_port": 8799
      }
    }
  },
  "x-runtipi": {
    "schema_version": 2,
    "overrides": []
  }
}
