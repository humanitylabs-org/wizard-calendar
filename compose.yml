services:
  calendar:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: wizard-calendar:0.3.0
    pull_policy: never
    user: "1000:1000"
    ports: ["127.0.0.1:${CALENDAR_PORT:-18787}:8799"]
    environment:
      BIND: 0.0.0.0
      PORT: "8799"
      DATA_DIR: /data
      WIZARD_CORE_DIR: /core
      CALENDAR_TIMEZONE: "${CALENDAR_TIMEZONE:-UTC}"
      WIZARD_TRUSTED_HOSTS: "${WIZARD_TRUSTED_HOSTS:-127.0.0.1:18787,localhost:18787}"
      WIZARD_TRUSTED_ORIGINS: "${WIZARD_TRUSTED_ORIGINS:-http://127.0.0.1:18787,http://localhost:18787}"
    volumes: ["calendar-data:/data", "./.runtime/core:/core:ro"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 256m
    restart: unless-stopped
volumes:
  calendar-data: {}
